name: NPM release

# Prerelease-only copy for confirming npm Trusted Publishing. Dispatch it on this branch; it
# refuses to run on main and only publishes under the `prerelease` dist-tag.
on:
  workflow_dispatch: {}

concurrency:
  group: npm-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CI: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: "Publish ${{ github.ref_name }}"
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    # npm's Trusted Publisher config for @mapbox/react-colorpickr is bound to this workflow file and environment.
    environment: npm-release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Upgrade npm for OIDC trusted publishing support
        run: npm install -g npm@^11.5.1

      - name: Install npm dependencies
        run: npm ci --no-fund --no-audit --prefer-offline

      # Runs eslint, tsc, jest, and the example bundle build
      - name: Test
        run: npm test

      # Reads the current version from public npmjs and git history
      - id: version
        uses: mapbox/gha-public/action-conventional-commit-version@main
        with:
          before-sha: ${{ github.event.before }}
          after-sha: ${{ github.event.after }}

      # prepublishOnly builds dist/
      - name: Publish prerelease
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.npm_publish_tag }}
        run: |
          if [ "$TAG" != prerelease ] || [[ "$VERSION" != *-* ]]; then
            echo "Refusing to publish '$VERSION' under '$TAG'; only prereleases are allowed." >&2
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version
          npm publish --tag prerelease
