<!DOCTYPE html>
<html>
<head>
  <title>React colorpickr over iframe</title>
  <link href="https://api.mapbox.com/mapbox-assembly/mbx/v1.3.1/assembly.min.css" rel="stylesheet">
  <link href='colorpickr.css' rel='stylesheet' />
  <style>
    html, body { height: 100%; margin: 0; }
    #frame {
      position: absolute; inset: 0;
      width: 100%; height: 100%; border: 0;
    }
    #output-fill { position: absolute; bottom: 0; left: 0; right: 0; height: 12px; z-index: 1; }
  </style>
</head>
<body>
  <div id='stage'>
    <iframe id='frame' srcdoc="
      <style>
        html,body { height:100%; margin:0; font-family:sans-serif; }
        body {
          background: repeating-linear-gradient(45deg,#eee,#eee 20px,#ddd 20px,#ddd 40px);
          display:flex; align-items:center; justify-content:center; color:#666;
        }
      </style>
      <body>I am an iframe. Release the mouse button over me.</body>
    "></iframe>

    <div id='app'></div>
    <div id='output-fill'></div>
  </div>
  <script src='bundle.js'></script>
</body>
</html>
